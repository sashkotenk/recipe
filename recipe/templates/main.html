{% extends "base.html" %}
{% block content %}
  <h1>10 випадкових рецептів</h1>
  <ul>
    {% for r in recipes %}
      <li>
        <a href="{% url 'recipe:category_detail' r.category.id %}">
          {{ r.title }}
        </a>
      </li>
    {% empty %}
      <li>Рецептів не знайдено.</li>
    {% endfor %}
  </ul>
{% endblock %}
